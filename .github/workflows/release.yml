name: Build and Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag/Release version (leave empty to use gradle.properties version)'
        required: false
        default: ''
      draft:
        description: 'Create as draft'
        type: boolean
        default: false
      prerelease:
        description: 'Create as pre-release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release JetBrains Plugin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read version and set tag
        id: meta
        shell: bash
        run: |
          VERSION=$(grep "pluginVersion" gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag_name }}" ]; then
            echo "release_tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            echo "release_tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "release_tag=v$VERSION" >> $GITHUB_OUTPUT
          fi

      - name: Run Tests
        run: |
          chmod +x gradlew
          ./gradlew test

      - name: Package JetBrains Plugin (.zip)
        run: |
          ./gradlew buildPlugin

      - name: Upload Artifacts to Actions Run
        uses: actions/upload-artifact@v4
        with:
          name: review-hub-plugin
          path: build/distributions/*.zip

      - name: Create or Update GitHub Release
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.release_tag }}
          name: Review Hub ${{ steps.meta.outputs.release_tag }}
          draft: ${{ github.event.inputs.draft || false }}
          prerelease: ${{ github.event.inputs.prerelease || false }}
          make_latest: true
          generate_release_notes: true
          append_body: false
          files: build/distributions/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # =========================================================================
      # Version Check: Kiểm tra phiên bản plugin so với Git tag / Marketplace
      # =========================================================================
      - name: Check JetBrains Plugin Version for Publishing
        id: check_versions
        shell: bash
        run: |
          echo "======================================================="
          echo "Checking JetBrains plugin version..."
          echo "======================================================="

          LOCAL_JB_VER=$(grep "pluginVersion" gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')
          
          # Kiểm tra nếu git tag cho version này đã tồn tại
          if git rev-parse "v$LOCAL_JB_VER" >/dev/null 2>&1; then
            TAG_EXISTS="true"
          else
            TAG_EXISTS="false"
          fi

          echo "JetBrains: local=$LOCAL_JB_VER | tag_exists=$TAG_EXISTS"
          if [ "$TAG_EXISTS" = "true" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "publish_jetbrains=false" >> $GITHUB_OUTPUT
            echo "-> [SKIP] Version v$LOCAL_JB_VER already exists in git tags."
          else
            echo "publish_jetbrains=true" >> $GITHUB_OUTPUT
            echo "-> [YES] Will attempt to publish version $LOCAL_JB_VER."
          fi

      # -------------------------------------------------------------------------
      # Publish Plugin lên JetBrains Marketplace (Bỏ qua lỗi trùng phiên bản)
      # -------------------------------------------------------------------------
      - name: Publish Plugin to JetBrains Marketplace
        if: (github.ref_type == 'tag' || github.ref == 'refs/heads/main') && steps.check_versions.outputs.publish_jetbrains == 'true' && env.JETBRAINS_TOKEN != ''
        continue-on-error: true
        id: publish_jb
        run: |
          ./gradlew publishPlugin
        env:
          JETBRAINS_TOKEN: ${{ secrets.JETBRAINS_TOKEN }}

      - name: Handle Publish Result
        if: steps.publish_jb.outcome == 'failure'
        run: |
          echo "::warning::publishPlugin did not succeed (version $LOCAL_JB_VER may already exist on JetBrains Marketplace channel). Workflow continues without failing."
