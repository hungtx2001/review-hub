name: Build and Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag/Release version (leave empty to use gradle.properties version)'
        required: false
        default: ''
      draft:
        description: 'Create as draft'
        type: boolean
        default: false
      prerelease:
        description: 'Create as pre-release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release JetBrains Plugin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read version and set tag
        id: meta
        shell: bash
        run: |
          VERSION=$(grep "pluginVersion" gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag_name }}" ]; then
            echo "release_tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            echo "release_tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "release_tag=v$VERSION" >> $GITHUB_OUTPUT
          fi

      - name: Run Tests
        run: |
          chmod +x gradlew
          ./gradlew test

      - name: Package JetBrains Plugin (.zip)
        run: |
          ./gradlew buildPlugin

      - name: Upload Artifacts to Actions Run
        uses: actions/upload-artifact@v4
        with:
          name: review-hub-plugin
          path: build/distributions/*.zip

      - name: Create or Update GitHub Release
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.release_tag }}
          name: Review Hub ${{ steps.meta.outputs.release_tag }}
          draft: ${{ github.event.inputs.draft || false }}
          prerelease: ${{ github.event.inputs.prerelease || false }}
          make_latest: true
          generate_release_notes: true
          files: build/distributions/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # =========================================================================
      # Version Check: Kiểm tra phiên bản plugin so với git tag trước đó
      # =========================================================================
      - name: Check JetBrains Plugin Version for Publishing
        id: check_versions
        shell: bash
        run: |
          echo "======================================================="
          echo "Checking JetBrains plugin version..."
          echo "======================================================="

          LOCAL_JB_VER=$(grep "pluginVersion" gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            PREV_JB_VER=$(git show "$PREV_TAG:gradle.properties" 2>/dev/null | grep "pluginVersion" | cut -d'=' -f2 | tr -d '[:space:]' || echo "none")
          else
            PREV_JB_VER="none"
          fi
          echo "JetBrains: local=$LOCAL_JB_VER | prev_tag ($PREV_TAG)=$PREV_JB_VER"
          if [ "$LOCAL_JB_VER" != "$PREV_JB_VER" ] || [ -z "$PREV_TAG" ]; then
            echo "publish_jetbrains=true" >> $GITHUB_OUTPUT
            echo "-> [YES] JetBrains Plugin version changed. Will publish to JetBrains Marketplace."
          else
            echo "publish_jetbrains=false" >> $GITHUB_OUTPUT
            echo "-> [SKIP] JetBrains Plugin version unchanged ($LOCAL_JB_VER)."
          fi

      # -------------------------------------------------------------------------
      # Publish Plugin lên JetBrains Marketplace
      # -------------------------------------------------------------------------
      - name: Publish Plugin to JetBrains Marketplace
        if: (github.ref_type == 'tag' || github.ref == 'refs/heads/main') && steps.check_versions.outputs.publish_jetbrains == 'true' && env.JETBRAINS_TOKEN != ''
        run: |
          ./gradlew publishPlugin
        env:
          JETBRAINS_TOKEN: ${{ secrets.JETBRAINS_TOKEN }}
